name: Release

# Publishes the built jar to the repo's Releases page (not to Actions artifacts).
#
#   Tag push:   git tag v1.1.0 && git push origin v1.1.0
#   Manual run: Actions -> Release -> Run workflow, type a tag like v1.1.0
#               (the tag is created for you if it doesn't exist yet)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v1.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Work out the version from the tag
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon -Pmod_version="$VERSION"

      - name: Pick the mod jar (skip the -sources / -dev jars)
        run: |
          ls -l build/libs
          JAR=$(ls build/libs/*.jar | grep -v -e '-sources' -e '-dev' | head -n 1)
          test -n "$JAR" || { echo "No mod jar found"; exit 1; }
          echo "JAR=$JAR" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Spotify HUD ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: ${{ env.JAR }}
          generate_release_notes: true
          fail_on_unmatched_files: true
